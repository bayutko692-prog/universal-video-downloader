name: Promode Video Downloader Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies & ffmpeg
      run: |
        pip install flask requests beautifulsoup4 rich yt-dlp
        sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Start Video Downloader App
      run: |
        python3 app.py &
        sleep 5
        # Keep alive for action duration
        sleep 21600
